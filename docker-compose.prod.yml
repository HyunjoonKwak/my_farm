# GHCR 이미지 기반 프로덕션 배포용 (NAS용)
# 사용법: docker-compose -f docker-compose.prod.yml up -d

services:
  app:
    image: ghcr.io/${GHCR_USERNAME:-hyunjoonkwak}/my-farm:${IMAGE_TAG:-latest}
    container_name: my-farm
    restart: unless-stopped
    ports:
      - "3024:3000"
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=file:/app/prisma/data/retirefarm.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_ADMIN_ID=${KAKAO_ADMIN_ID:-}
      - KAKAO_ADMIN_USER_ID=${KAKAO_ADMIN_USER_ID:-}
      - GARAK_API_ID=${GARAK_API_ID}
      - GARAK_API_PASSWORD=${GARAK_API_PASSWORD}
      - CRON_SECRET=${CRON_SECRET}
      - EXTERNAL_PORTFOLIO_API_URL=${EXTERNAL_PORTFOLIO_API_URL}
      - EXTERNAL_PORTFOLIO_API_KEY=${EXTERNAL_PORTFOLIO_API_KEY}
      # 자본 게이지 — 허브 순자산 단일 소스 (Asset Hub §2.4, 읽기 전용).
      # 부분 소스를 직접 합산하면 현금·비부동산 부채가 빠진다.
      - MY_PORTAL_URL=${MY_PORTAL_URL:-}
      - MY_PORTAL_SNAPSHOT_TOKEN=${MY_PORTAL_SNAPSHOT_TOKEN:-}
      # 매도 시뮬 프록시 — asset_manager 직접 연결 (§1.5.3, 게이지와 별개 경로).
      # asset(naver-crawler-web)은 0.0.0.0:3000 공개라 NAS IP로 접근.
      - ASSET_MANAGER_URL=${ASSET_MANAGER_URL:-}
      - ASSET_MANAGER_SNAPSHOT_TOKEN=${ASSET_MANAGER_SNAPSHOT_TOKEN:-}
      # 브라우저 딥링크용 공개 URL (서버 컴포넌트에서 런타임 참조)
      - NEXT_PUBLIC_ASSET_MANAGER_URL=${NEXT_PUBLIC_ASSET_MANAGER_URL:-}
      - BACKUP_DIR=/backups
    volumes:
      - ${BACKUP_PATH:-${BACKUP_DIR:-./backups}}:/backups
      - ${DATA_PATH:-./data}:/app/prisma/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      # §2.4 전환으로 portfolio-backend 직접 호출이 사라져 외부 네트워크 합류가 불필요해졌다.
      # my_portal(0.0.0.0:8100)·asset(0.0.0.0:3000) 모두 호스트 포트로 접근한다.
      - my-farm-network

networks:
  my-farm-network:
    driver: bridge
